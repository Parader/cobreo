[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify's CDN serves /public directly and never reaches Next's `headers()`, so the
# default `max-age=0, must-revalidate` sticks. These filenames are not content-hashed:
# bump a `?v=` query when replacing an asset.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[build.environment]
  NODE_VERSION = "22"
  # CONTACT_NOTIFY_EMAIL (and similar) match public site copy (contact@cobreo.ca in i18n/SEO)
  # and are also inlined into the Next server bundle. Omit-keys alone still failed the scan.
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_ADMIN_PATH_SECRET,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_POSTHOG_KEY,NEXT_PUBLIC_POSTHOG_HOST,RESEND_FROM_EMAIL,CONTACT_NOTIFY_EMAIL,BOOKING_ORGANIZER_EMAIL,BOOKING_MEET_LINK"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,scripts/resend-last-booking.ts,src/messages/fr.json,src/messages/en.json,src/lib/seo.ts"
